<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TechStore</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">TechStore</div>
                <nav>
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/#products">Products</a></li>
                        <li><a href="/track.html">Track Order</a></li>
                    </ul>
                </nav>
                <div class="auth-buttons">
                    <a href="/register.html" class="btn btn-secondary">Register</a>
                </div>
            </div>
        </div>
    </header>

    <main style="min-height: 70vh; display: flex; align-items: center;">
        <div class="container">
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 2rem; color: #2c3e50;">Login to TechStore</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">
                        <span class="btn-text">Login</span>
                        <div class="loading" style="display: none;"></div>
                    </button>
                </form>
                
                <p style="text-align: center;">
                    Don't have an account? <a href="/register.html">Register here</a>
                </p>
                
                <div style="margin-top: 2rem; padding: 1rem; background: #f8f9fa; border-radius: 5px;">
                    <h4>Demo Accounts:</h4>
                    <p><strong>Admin:</strong> admin@techstore.com / admin123</p>
                    <p><strong>User:</strong> user@techstore.com / user123</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const btnText = submitBtn.querySelector('.btn-text');
            const loading = submitBtn.querySelector('.loading');
            
            // Show loading state
            btnText.style.display = 'none';
            loading.style.display = 'inline-block';
            submitBtn.disabled = true;
            
            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                const data = await auth.login(email, password);
                
                showAlert('Login successful!', 'success');
                
                // Check if there's a redirect URL in the query parameters
                const urlParams = new URLSearchParams(window.location.search);
                const redirectUrl = urlParams.get('redirect');
                
                // Redirect based on user role or redirect parameter
                setTimeout(() => {
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else if (data.user.role === 'admin') {
                        window.location.href = '/dashboard.html';
                    } else {
                        window.location.href = '/';
                    }
                }, 1000);
                
            } catch (error) {
                showAlert(error.message, 'error');
            } finally {
                // Reset button state
                btnText.style.display = 'inline';
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
